name: Update CEO Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_dashboard.py"
      - ".github/workflows/update-dashboard.yml"
  schedule:
    # GitHub scheduled jobs can be delayed or dropped during busy periods.
    # Four off-peak attempts per hour make the public dashboard resilient.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-ceo-dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch, validate, and write dashboard data
        env:
          MARKET_API_KEY: ${{ secrets.MARKET_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TZ: Asia/Taipei
        run: python scripts/update_dashboard.py

      - name: Commit changed data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add dashboard.json
          git diff --cached --quiet || git commit -m "chore: hourly dashboard update"
          git push

      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
